[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-link-checker"
version = "0.1.0"
description = "CLI utility that scans a directory for *.md files and reports broken inline links and images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "rich",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
